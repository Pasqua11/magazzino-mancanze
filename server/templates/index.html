<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titolo }} - Magazzino</title>
    <style>
        :root {
            --primary: #2563eb;
            --surface: #ffffff;
            --background: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 2rem 0;
            flex-direction: column;
            justify-content: flex-start;
        }

        .container {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            /* Centra orizzontalmente */
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #1e293b;
        }

        input,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .success-msg {
            display: none;
            background-color: #dcfce7;
            color: #166534;
            padding: 0.75rem;
            border-radius: 6px;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>{{ titolo }}</h1>
        <div style="text-align: center; margin-bottom: 1.5rem; display: flex; justify-content: center; gap: 1.5rem;">
            <a href="/archivio" style="color: var(--primary); text-decoration: none; font-weight: 500;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="vertical-align: text-bottom;">
                    <path d="M21 8v13H3V8"></path>
                    <path d="M1 3h22v5H1z"></path>
                    <line x1="10" y1="12" x2="14" y2="12"></line>
                </svg>
                Vai all'Archivio
            </a>
            <a href="/settings" style="color: var(--text-muted); text-decoration: none; font-weight: 500;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="vertical-align: text-bottom;">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
                Impostazioni
            </a>
        </div>
        <form id="mancanzaForm">
            <div class="form-group">
                <label for="prodotto">Prodotto</label>
                <input type="text" id="prodotto" required placeholder="Es. Viti 4x50">
            </div>

            <div class="form-group">
                <label for="quantita">Quantità (opzionale)</label>
                <input type="text" id="quantita" placeholder="Es. 2 pacchi">
            </div>

            <div class="form-group">
                <label for="note">Note</label>
                <textarea id="note" rows="3" placeholder="Dettagli aggiuntivi..."></textarea>
            </div>

            <button type="submit" id="btnInvia">Invia Segnalazione</button>
        </form>
        <div id="successMsg" class="success-msg">Segnalazione inviata con successo!</div>
    </div>

    <div class="container" style="margin-top: 2rem;">
        <h1>Lista {{ titolo }}</h1>
        <div id="listaMancanze">
            <p style="text-align: center; color: var(--text-muted);">Caricamento...</p>
        </div>

        <div
            style="text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.8rem; border-top: 1px solid #e2e8f0; padding-top: 1rem;">
            Software creato da <strong>Trentarossi Luca</strong>
        </div>

    </div>

    <script>
        // Il testo dei prodotti lo scrive chi compila il modulo: va inserito
        // come testo, mai come HTML, altrimenti un nome che contiene tag viene
        // eseguito dal browser di chi apre la pagina.
        function escapeHtml(testo) {
            if (testo === null || testo === undefined) return '';
            return String(testo).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // Setup Form
        document.getElementById('mancanzaForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('btnInvia');
            const originalText = btn.textContent;
            btn.textContent = 'Invio in corso...';
            btn.disabled = true;

            const data = {
                prodotto: document.getElementById('prodotto').value,
                quantita: document.getElementById('quantita').value,
                note: document.getElementById('note').value
            };

            try {
                const response = await fetch('/api/mancanze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    document.getElementById('mancanzaForm').reset();
                    const msg = document.getElementById('successMsg');
                    msg.style.display = 'block';
                    setTimeout(() => msg.style.display = 'none', 3000);
                    loadMancanze(); // Ricarica la lista
                } else {
                    alert('Errore durante l\'invio.');
                }
            } catch (error) {
                console.error('Errore:', error);
                alert('Impossibile connettersi al server.');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });

        // Caricamento Lista
        async function loadMancanze() {
            const container = document.getElementById('listaMancanze');
            try {
                const response = await fetch(`/api/mancanze?t=${Date.now()}`);
                if (!response.ok) throw new Error("Errore fetch");
                const data = await response.json();

                if (data.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Nessuna mancanza segnalata.</p>';
                    return;
                }

                // Ordina per data decrescente (più recenti in alto)
                data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                let html = '<ul style="list-style: none; padding: 0;">';
                data.forEach(item => {
                    const statusColor = item.stato === 'pending' ? '#ef4444' : '#22c55e'; // Rosso se pending, Verde se ordered
                    const statusText = item.stato === 'pending' ? 'In Attesa' : 'Ordinato';
                    const date = new Date(item.timestamp).toLocaleString('it-IT', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });

                    html += `
                        <li style="background: white; border: 1px solid #e2e8f0; padding: 1rem; margin-bottom: 0.5rem; border-radius: 8px; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <div style="font-weight: bold; font-size: 1.2rem; margin-bottom: 0.25rem;">${escapeHtml(item.prodotto)}</div>
                                <div style="color: var(--text-main); font-size: 1rem; margin-bottom: 0.25rem;">
                                    ${item.quantita ? `<span style="background-color: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 4px; font-weight: bold;">Qta: ${escapeHtml(item.quantita)}</span> • ` : ''} 
                                    <span style="color: var(--text-muted); font-size: 0.9rem;">${date}</span>
                                </div>
                                ${item.note ? `<div style="background-color: #fffbeb; color: #b45309; border: 1px solid #fcd34d; padding: 4px 8px; border-radius: 4px; font-weight: 500; font-size: 0.95rem; margin-top: 0.5rem; display: inline-block;">Note: ${escapeHtml(item.note)}</div>` : ''}
                            </div>
                            <div style="text-align: right;">
                                <span style="display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; background-color: ${item.stato === 'pending' ? '#fee2e2' : '#dcfce7'}; color: ${statusColor};">
                                    ${statusText}
                                </span>
                                ${item.stato === 'pending' ? `
                                <button onclick="markOrdered('${item.id}')" style="background: none; border: none; cursor: pointer; color: #22c55e; margin-left: 0.5rem; padding: 0.25rem;" title="Segna come Ordinato">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </button>
                                ` : ''}

                                <button onclick="deleteMancanza('${item.id}')" style="background: none; border: none; cursor: pointer; color: #94a3b8; margin-left: 0.25rem; padding: 0.25rem;" title="Elimina">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </div>
                        </li>
                    `;
                });
                html += '</ul>';
                container.innerHTML = html;

            } catch (error) {
                console.error(error);
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Errore nel caricamento dati.</p>';
            }
        }

        async function markOrdered(id) {
            try {
                const response = await fetch(`/api/mancanze/${id}/ordinato`, { method: 'POST' });
                if (response.ok) {
                    loadMancanze();
                } else {
                    alert('Errore aggiornamento');
                }
            } catch (e) {
                console.error(e);
                alert('Errore di connessione');
            }
        }

        async function archiveMancanza(id) {
            if (!confirm('Vuoi archiviare questo articolo?')) return;
            try {
                const response = await fetch(`/api/mancanze/${id}/archivia`, { method: 'POST' });
                if (response.ok) {
                    loadMancanze();
                } else {
                    alert('Errore archiviazione');
                }
            } catch (e) {
                console.error(e);
                alert('Errore di connessione');
            }
        }

        async function deleteMancanza(id) {
            if (!confirm('Sei sicuro di voler eliminare questo articolo?')) return;

            try {
                const response = await fetch(`/api/mancanze/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadMancanze();
                } else {
                    alert('Errore eliminazione');
                }
            } catch (e) {
                console.error(e);
                alert('Errore di connessione');
            }
        }

        // Carica init
        loadMancanze();
        // Aggiorna ogni 10 secondi
        setInterval(loadMancanze, 10000);
    </script>
</body>

</html>
